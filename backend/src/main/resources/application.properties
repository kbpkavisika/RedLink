spring.application.name=backend
# The host (Render) chooses the port and passes it as PORT; 8080 on your machine
server.port=${PORT:8080}

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/redLink
spring.datasource.username=postgres
# Password is in application-local.properties (git-ignored)
spring.config.import=optional:classpath:application-local.properties

# JPA / Hibernate
# Flyway creates the tables from db/migration/*.sql.
# validate makes Hibernate only check that the entities match those tables;
# the app refuses to start if they don't.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# The database connection closes when the service method ends, not at the end of the HTTP request.
# Lazy-loading outside a service then fails loudly instead of silently running extra queries.
spring.jpa.open-in-view=false

# Authentication (JWT)
# redlink.jwt.secret is NOT here: put it in application-local.properties, or set the
# REDLINK_JWT_SECRET environment variable when deployed. The app won't start without it.
redlink.jwt.issuer=redlink
# Normal sign-in, and "Keep me signed in"
redlink.jwt.expiry=12h
redlink.jwt.remember-me-expiry=7d

# First admin account, created once at startup if no admin exists.
# redlink.admin.email and redlink.admin.password are NOT here: put them in application-local.properties,
# or set REDLINK_ADMIN_EMAIL / REDLINK_ADMIN_PASSWORD when deployed.
redlink.admin.full-name=RedLink Admin

# Matching: how many of a request's matches are notified when it's posted (README "Matching engine")
#   notified = min(units needed x urgency multiplier, max-notified, number of matches)
redlink.matching.multiplier.low=2
redlink.matching.multiplier.medium=3
redlink.matching.multiplier.high=5
redlink.matching.multiplier.critical=8
redlink.matching.max-notified=25

# Expiry (H10): OPEN requests past their needed-by time become EXPIRED. Runs at startup, then this long after
# each run finishes (ISO-8601 duration). Set redlink.expiry.enabled=false to switch it off.
redlink.expiry.interval=PT5M

# Rate limits on sign-in and registration (AuthRateLimiter): at most <requests> in any <per> (ISO-8601 duration).
# Over a limit the API answers 429 with Retry-After. Kept in memory, so a restart resets them.
redlink.rate-limit.enabled=true
redlink.rate-limit.login-per-ip.requests=10
redlink.rate-limit.login-per-ip.per=PT1M
# Per account, from any address: stops guessing one password from many addresses
redlink.rate-limit.login-per-email.requests=10
redlink.rate-limit.login-per-email.per=PT15M
redlink.rate-limit.register-per-ip.requests=5
redlink.rate-limit.register-per-ip.per=PT1H
# Messages to the AI assistant per account: keeps the free Groq quota shared fairly
redlink.rate-limit.chat-per-user.requests=20
redlink.rate-limit.chat-per-user.per=PT10M
# Where the visitor's address comes from when deployed behind a proxy (empty = the connecting address).
# Only a header the host overwrites, never one a visitor can set; see application-prod.properties.
redlink.rate-limit.client-ip-header=

# AI assistant (POST /api/chat), answered by Groq (README "AI assistant")
# redlink.ai.groq.api-key is NOT here: put it in application-local.properties, or set REDLINK_AI_GROQ_API_KEY
# when deployed. Without a key the app still starts and the assistant answers "not available".
redlink.ai.groq.base-url=https://api.groq.com/openai/v1
# Free-tier keys can't use the Llama models; GET https://api.groq.com/openai/v1/models lists what a key can use
redlink.ai.groq.model=openai/gpt-oss-120b
# gpt-oss thinks before answering: low keeps that short and saves tokens (leave empty for non-reasoning models)
redlink.ai.groq.reasoning-effort=low
redlink.ai.groq.max-tokens=600
redlink.ai.groq.timeout=PT30S
# Earlier messages sent with each question, and the longest question a user may type
redlink.ai.groq.max-history=12
redlink.ai.groq.max-message-length=1000

# Health check: only /actuator/health is exposed, and it says just UP or DOWN (no details, no other endpoints)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Error responses never include stack traces or exception details (GlobalExceptionHandler writes our own)
server.error.include-stacktrace=never
server.error.include-message=never
