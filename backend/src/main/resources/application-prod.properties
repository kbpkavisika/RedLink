# Production settings: active when SPRING_PROFILES_ACTIVE=prod (set on Render).
# Everything secret comes from environment variables, never from this file:
#   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD   the Neon database
#   REDLINK_JWT_SECRET                         at least 32 characters; a new one, not your local secret
#   REDLINK_ADMIN_EMAIL, REDLINK_ADMIN_PASSWORD   the first admin (created once, must change it at sign-in)
#   REDLINK_CORS_ALLOWED_ORIGINS              the frontend's address, e.g. https://redlink.vercel.app

# No SQL in the logs: it's noisy and can include personal data
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Neon's free tier allows few connections; a small pool is plenty for this app
spring.datasource.hikari.maximum-pool-size=5

# Render sits in front of the app as a proxy; trust its X-Forwarded-* headers for the real scheme and host
server.forward-headers-strategy=framework

# Rate limits need the visitor's real address. Requests arrive through Vercel and Render's proxies, so the
# connecting address is a proxy's. Set REDLINK_RATE_LIMIT_CLIENT_IP_HEADER to the header that carries the
# visitor's address once it's confirmed on the live site; until then every visitor shares one per-address
# limit (the per-account sign-in limit works either way). Never X-Forwarded-For: Spring reads and hides it,
# and its first value is whatever the visitor sent.

# Sample data must never run here: DevDataSeeder refuses to start under the prod profile
redlink.seed.enabled=false