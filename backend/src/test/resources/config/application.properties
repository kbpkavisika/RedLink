# Test-only settings. Spring Boot reads config/application.properties in addition to the main
# application.properties and lets it win, so tests (locally and in CI) get these values automatically.

# Tests use their own database, so seed data and your manual testing in redLink can't affect them
# (and tests can't touch your data). Same server, user and password as the app.
spring.datasource.url=jdbc:postgresql://localhost:5432/redLink_test

# Only for tests; never used anywhere else
redlink.jwt.secret=test-only-secret-not-for-real-use-0123456789abcdef

# Keep the admin seeder off in tests, even if application-local.properties sets an admin,
# so running the tests never creates an account in your local database
redlink.admin.email=
redlink.admin.password=

# Same for the sample data: DevDataSeederTest runs the seeder itself, inside a rolled-back transaction
redlink.seed.enabled=false

# Every test signs in and registers from the same address, so the limits are off;
# RateLimitIntegrationTest switches them on for itself
redlink.rate-limit.enabled=false

# No background expiry job in tests: RequestExpiryIntegrationTest calls RequestExpiryService itself
redlink.expiry.enabled=false
