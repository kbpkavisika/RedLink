# Netlify settings for the frontend. In Netlify, set Base directory to "frontend"; the rest comes from here.
# Does the same as vercel.json: forwards /api to the backend on Render, serves index.html for every
# page path (so refreshing /donor/requests works), and adds the security headers.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Same Node.js version as CI
  NODE_VERSION = "24"

# The browser only talks to this site; Netlify passes /api/* on to the backend, so no API address is
# built into the frontend. Must stay above the page fallback below: the first matching rule wins.
[[redirects]]
  from = "/api/*"
  to = "https://redlink-backend-v6ag.onrender.com/api/:splat"
  status = 200
  force = true

# Every other path is a page of the single-page app. Real files (JS, CSS, icons) are served as they
# are, because without "force" a rule only applies when no file exists at that path.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    # Scripts only from this site; styles and fonts also from Google Fonts; inline styles for toasts.
    # connect-src 'self' works because API calls go to this site's /api, which is forwarded above.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"

# File names in /assets change on every build, so browsers may keep them for a year
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
