name: redLink CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Temporary PostgreSQL database, only for the tests
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: redLink_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SPRING_DATASOURCE_PASSWORD: postgres

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and test
        run: |
          chmod +x mvnw
          ./mvnw -B verify

  frontend:
    # Keep this name: branch protection on main requires the check by name. It also runs the tests.
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  deploy:
    name: Deploy (Render + Vercel)
    # Only after both test jobs pass, and only for code that reached main (never for a PR)
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # Shows each deploy under "Deployments" on the repo page
    environment: production

    # One deploy at a time; a newer push waits instead of cancelling a deploy halfway
    concurrency:
      group: production
      cancel-in-progress: false

    env:
      BACKEND_URL: https://redlink-backend-v6ag.onrender.com

    steps:
      # The hook URLs are secrets: anyone who has one can start a deploy
      - name: Deploy backend to Render
        env:
          HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl --fail-with-body -sS -X POST "$HOOK_URL"

      - name: Deploy frontend to Vercel
        env:
          HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: curl --fail-with-body -sS -X POST "$HOOK_URL"

      # Smoke test: the backend must answer its health check within 10 minutes. Render's free tier
      # can take a minute or more to wake up, hence the retries. Render keeps the old version serving
      # until the new one is healthy, so this proves the backend is up, not which version answered.
      - name: Check backend health
        run: |
          for attempt in $(seq 1 20); do
            if curl -fsS -m 30 "$BACKEND_URL/actuator/health"; then
              echo
              echo "Backend is healthy"
              exit 0
            fi
            echo "Attempt $attempt: not ready yet, retrying in 30s"
            sleep 30
          done
          echo "Backend did not become healthy in time"
          exit 1
